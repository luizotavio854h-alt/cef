<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Interação Pickup - Nova Era</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; pointer-events: none; }
.interaction { position: absolute; left: 56%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.6)); }
.action { display: flex; align-items: center; gap: 9px; min-width: 145px; padding: 7px 12px 7px 7px; border: 1px solid rgba(0,240,255,.6); border-radius: 9px; background: rgba(15,22,35,.95); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s ease; }
.action:active { transform: scale(.95); background: rgba(0,240,255,.2); }
.key { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#00f0ff,#0077ff); color: #000; font-size: 12px; font-weight: 900; }
</style>
</head>
<body>
<div class="interaction" aria-label="Ações do pickup">
  <button class="action" onclick="send('/entrar')"><span class="key">F</span><span>ENTRAR / INTERAGIR</span></button>
  <button class="action" onclick="send('/sair')"><span class="key">Y</span><span>SAIR</span></button>
  <button class="action" onclick="send('/garagemorg')"><span class="key">G</span><span>GARAGEM ORG</span></button>
  <button class="action" onclick="send('/painelorg')"><span class="key">P</span><span>ADMIN ORG</span></button>
</div>
<script>
function send(command){
  if(window.Android && typeof window.Android.sendCommand==='function') {
    window.Android.sendCommand(command);
  } else if (window.CefBrowser && typeof window.CefBrowser.sendEvent === 'function') {
    window.CefBrowser.sendEvent(20, 1, 'command|' + command);
  }
}
</script>
</body>
</html>
