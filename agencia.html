<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agência de Empregos - Conexão Roleplay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* Window Principal ajustada para ocupar no máximo 75% da tela em landscape (máx 75vh de altura / 75vw de largura) */
    .realestate-window {
      width: 92vw;
      max-width: 1100px;
      height: 88vh;
      max-height: 680px;
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      border: 1px solid rgba(255, 204, 0, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 204, 0, 0.03);
      padding: clamp(12px, 2vh, 25px) clamp(15px, 2vw, 30px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Topo Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5vh;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1.2vh;
    }

    .title-box h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffcc00;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .title-box span {
      font-size: 0.6rem;
      color: #777;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* Navegação por Abas */
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #888;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffcc00;
      color: #000;
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
    }

    .player-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #ccc;
    }

    .player-stats .yellow {
      color: #ffcc00;
    }

    /* Layout do Conteúdo Principal */
    .main-content {
      display: grid;
      grid-template-columns: 38% 1fr;
      gap: 20px;
      flex: 1;
      overflow: hidden;
    }

    /* Coluna Esquerda: Lista de Cards */
    .properties-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .properties-list::-webkit-scrollbar {
      width: 4px;
    }

    .properties-list::-webkit-scrollbar-thumb {
      background: rgba(255, 204, 0, 0.4);
      border-radius: 4px;
    }

    .property-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .property-card:hover, .property-card.selected {
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.03);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.05);
    }

    .card-thumb {
      width: 75px;
      height: 75px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255, 204, 0, 0.2);
    }

    .card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .card-tag {
      font-size: 0.5rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-free { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.4); }
    .tag-cnh { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.4); }
    .tag-active { background: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.4); }

    .card-location {
      font-size: 0.6rem;
      color: #777;
    }

    .card-details {
      display: flex;
      gap: 8px;
      font-size: 0.55rem;
      color: #aaa;
    }

    .card-price {
      font-size: 0.8rem;
      font-weight: 800;
      color: #ffcc00;
    }

    /* Coluna Direita: Detalhes do Trabalho + Mapa */
    .details-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .map-container {
      flex: 1;
      background: #111 url('https://upload.wikimedia.org/wikipedia/commons/2/23/GTA_SA_map.PNG') center/cover;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      min-height: 150px;
    }

    .map-pin {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ffcc00;
      border: 2px solid #000;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffcc00;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    .preview-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 204, 0, 0.2);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spec-label {
      font-size: 0.5rem;
      color: #777;
      text-transform: uppercase;
      font-weight: 700;
    }

    .spec-value {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
    }

    .spec-value.yellow { color: #ffcc00; }

    /* Botões de Ação */
    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn-primary {
      background: #ffcc00;
      color: #000;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.6);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.4);
    }

    .btn-danger:hover {
      background: #e74c3c;
      color: #fff;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 1rem;
      cursor: pointer;
    }

    .close-btn:hover { color: #ffcc00; }
  </style>
</head>
<body>

  <div class="realestate-window">
    <button class="close-btn" id="close-button" title="Fechar">X</button>
    
    <!-- Topo -->
    <div class="header-bar">
      <div class="title-box">
        <h1>AGÊNCIA DE EMPREGOS</h1>
        <span>SERVIÇOS CONEXÃO ROLEPLAY</span>
      </div>

      <div class="nav-tabs">
        <button class="tab-btn active" id="tab-catalog">Vagas Disponíveis</button>
        <button class="tab-btn" id="tab-my-jobs">Meu Emprego</button>
      </div>

      <div class="player-stats">
        <span>Nível: <strong class="yellow">3</strong></span>
        <span>CNH: <strong class="yellow">AB / C / D</strong></span>
      </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
      
      <!-- Lista de Serviços (Esquerda) -->
      <div class="properties-list" id="jobs-container">
        <!-- Renderizado via JS -->
      </div>

      <!-- Mapa e Informações (Direita) -->
      <div class="details-column">
        
        <div class="map-container">
          <div class="map-pin" id="map-pin" style="top: 75%; left: 50%;" title="HQ do Serviço"></div>
        </div>

        <div class="preview-box">
          <div class="spec-grid" id="spec-grid">
            <!-- Especificações dinâmicas -->
          </div>

          <!-- Botões de Ação -->
          <div class="action-row" id="action-buttons">
            <!-- Botões alternam via JS conforme a aba -->
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // Lista de Serviços
    const jobsData = [
      { id: 3, name: "Empacotador", req: "Nenhum", tag: "Livre", pay: "R$ 200 - R$ 350", level: "Nível 0", vehicle: "A pé", location: "Empacotamento", pin: { top: "82%", left: "58%" }, img: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=200" },
      { id: 1, name: "Pizzaboy", req: "Nenhum", tag: "Livre", pay: "R$ 180 - R$ 300", level: "Nível 0", vehicle: "Moto", location: "Pizzaria", pin: { top: "72%", left: "50%" }, img: "https://images.unsplash.com/photo-1526367790999-0150786686a2?q=80&w=200" },
      { id: 5, name: "Caminhoneiro", req: "Nenhum", tag: "Livre", pay: "R$ 450 - R$ 800", level: "Nível 0", vehicle: "Caminhão", location: "Depósito de cargas", pin: { top: "68%", left: "52%" }, img: "https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=200" }
    ];

    // Emprego do jogador, preenchido pelo GM via Cef_EvalJS.
    const myJobData = [];

    let currentTab = 'catalog';

    const jobsContainer = document.getElementById('jobs-container');
    const specGrid = document.getElementById('spec-grid');
    const actionButtons = document.getElementById('action-buttons');
    const mapPin = document.getElementById('map-pin');

    function sendCommand(command) {
      const normalized = typeof command === 'string' ? command.trim() : '';
      if (!normalized) return;

      try {
        if (window.Android && typeof window.Android.sendCommand === 'function') {
          window.Android.sendCommand(normalized);
          return;
        }
        if (window.CefBrowser && typeof window.CefBrowser.sendEvent === 'function') {
          window.CefBrowser.sendEvent(20, 1, 'command|' + normalized);
          return;
        }
        if (window.cef && typeof window.cef.emit === 'function') {
          window.cef.emit('game:command', normalized);
        }
      } catch (error) {
        console.error('[AGENCIA] Erro ao enviar comando:', error);
      }
    }

    function closeAgency() {
      if (window.Android && typeof window.Android.close === 'function') {
        window.Android.close();
      }
    }

    function markJob(item) {
      sendCommand(`emprego gps ${item.id}`);
    }

    function hireJob(item) {
      sendCommand(`emprego contratar ${item.id}`);
    }

    function resignJob() {
      sendCommand('emprego sair');
    }

    window.agenciaBridge = {
      open: function(data) {
        const jobId = Number(data && data.jobId || 0);
        const level = data && data.level !== undefined ? data.level : 0;
        document.querySelector('.player-stats .yellow').textContent = level;
        myJobData.splice(0, myJobData.length);

        const job = jobsData.find(item => item.id === jobId);
        if (job) {
          myJobData.push({ ...job, tag: 'Emprego Atual' });
        }

        if (currentTab === 'my-jobs') {
          renderView('my-jobs');
        }
      }
    };

    function renderView(tab) {
      currentTab = tab;
      jobsContainer.innerHTML = '';
      const list = tab === 'catalog' ? jobsData : myJobData;

      if(list.length === 0) {
        jobsContainer.innerHTML = `<p style="color:#777; font-size:0.75rem; text-align:center; margin-top:20px;">Você está desempregado no momento.</p>`;
        return;
      }

      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `property-card ${index === 0 ? 'selected' : ''}`;
        
        let tagClass = 'tag-free';
        if(item.tag.includes('CNH')) tagClass = 'tag-cnh';
        if(tab === 'my-jobs') tagClass = 'tag-active';

        card.innerHTML = `
          <img src="${item.img}" class="card-thumb" alt="Serviço">
          <div class="card-info">
            <div class="card-header">
              <span class="card-title">${item.name}</span>
              <span class="card-tag ${tagClass}">${item.tag}</span>
            </div>
            <span class="card-location">📍 ${item.location}</span>
            <div class="card-details">
              <span>🚘 ${item.vehicle}</span>
              <span>⭐ ${item.level}</span>
            </div>
            <span class="card-price">${item.pay}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          document.querySelectorAll('.property-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          updateDetails(item);
        });

        jobsContainer.appendChild(card);
      });

      updateDetails(list[0]);
    }

    function updateDetails(item) {
      mapPin.style.top = item.pin.top;
      mapPin.style.left = item.pin.left;

      if(currentTab === 'catalog') {
        specGrid.innerHTML = `
          <div class="spec-item"><span class="spec-label">Pagamento Médio</span><span class="spec-value yellow">${item.pay}</span></div>
          <div class="spec-item"><span class="spec-label">Requisito</span><span class="spec-value">${item.req}</span></div>
          <div class="spec-item"><span class="spec-label">Nível Mínimo</span><span class="spec-value">${item.level}</span></div>
          <div class="spec-item"><span class="spec-label">Veículo</span><span class="spec-value">${item.vehicle}</span></div>
        `;
        actionButtons.innerHTML = `
          <button class="btn btn-secondary" id="gps-button">📍 Marcar HQ no GPS</button>
          <button class="btn btn-primary" id="hire-button">Contratar Serviço</button>
        `;
        document.getElementById('gps-button').addEventListener('click', () => markJob(item));
        document.getElementById('hire-button').addEventListener('click', () => hireJob(item));
      } else {
        specGrid.innerHTML = `
          <div class="spec-item"><span class="spec-label">Pagamento</span><span class="spec-value yellow">${item.pay}</span></div>
          <div class="spec-item"><span class="spec-label">Sua Licença</span><span class="spec-value">${item.req}</span></div>
          <div class="spec-item"><span class="spec-label">Nível Atual</span><span class="spec-value">${item.level}</span></div>
          <div class="spec-item"><span class="spec-label">Veículo Atual</span><span class="spec-value">${item.vehicle}</span></div>
        `;
        actionButtons.innerHTML = `
          <button class="btn btn-secondary" id="gps-button">📍 Marcar HQ no GPS</button>
          <button class="btn btn-danger" id="resign-button">Pedir Demissão</button>
        `;
        document.getElementById('gps-button').addEventListener('click', () => markJob(item));
        document.getElementById('resign-button').addEventListener('click', resignJob);
      }
    }

    document.getElementById('tab-catalog').addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderView('catalog');
    });

    document.getElementById('tab-my-jobs').addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderView('my-jobs');
    });

    document.getElementById('close-button').addEventListener('click', closeAgency);
    document.addEventListener('DOMContentLoaded', function() {
      sendCommand('agencia ready');
    });
    renderView('catalog');
  </script>
</body>
</html>
