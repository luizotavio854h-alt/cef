<style>

  .dial-display { text-align: center; font-size: 28px; min-height: 38px; margin: 6px 0 0; letter-spacing: 2px; font-weight: 300; }

<script>
/* ================= Utilidades ================= */
const $ = (id) => document.getElementById(id);
if (!Array.prototype.at) Array.prototype.at = function (i) { return this[i < 0 ? this.length + i : i]; };
const emit = (ev, ...a) => { if (window.cef && typeof cef.emit === 'function') cef.emit(ev, ...a); };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad2 = (n) => String(n).padStart(2, '0');
const hm = (ts) => { const d = new Date(ts); const t = new Date(); return d.toDateString() === t.toDateString() ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}` : `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`; };
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const COLORS = ['#e53935', '#8e24aa', '#3949ab', '#1e88e5', '#00897b', '#43a047', '#f4511e', '#6d4c41', '#546e7a'];

/* ================= Estado persistente ================= */

const DEF = () => ({

let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); S = Object.assign(DEF(), p); S.set = Object.assign(DEF().set, p.set || {}); S.me = Object.assign(DEF().me, p.me || {}); } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ================= Apps ================= */
const APPS = [
  { id: 'app-bank', name: 'CariocaPay', icon: 'fas fa-wallet', cls: 'bg-bank', kw: 'banco pix cairocapay capay dinheiro' },
  { id: 'app-phone', name: 'Telefone', icon: 'fas fa-phone', cls: 'bg-phone', kw: 'ligar chamadas' },
  { id: 'app-contacts', name: 'Contatos', icon: 'fas fa-address-book', cls: 'bg-contacts', kw: 'contatos agenda' },
  { id: 'app-whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp', cls: 'bg-whatsapp', kw: 'whatsapp mensagem status zap' },
  { id: 'app-gps', name: 'GPS', icon: 'fas fa-map-marked-alt', cls: 'bg-gps', kw: 'mapa rota' },
  { id: 'app-uber', name: 'Uber', icon: 'fas fa-car', cls: 'bg-uber', kw: 'corrida motorista' },
  { id: 'app-services', name: 'Serviços', icon: 'fas fa-shield-alt', cls: 'bg-services', kw: 'polícia samu mecânico emergência' },
  { id: 'app-camera', name: 'Câmera', icon: 'fas fa-camera', cls: 'bg-camera', kw: 'foto' },
  { id: 'app-gallery', name: 'Galeria', icon: 'fas fa-images', cls: 'bg-gallery', kw: 'fotos' },
  { id: 'app-music', name: 'Música', icon: 'fas fa-music', cls: 'bg-music', kw: 'rádio' },
  { id: 'app-olx', name: 'OLX', icon: 'fas fa-shopping-bag', cls: 'bg-olx', kw: 'vendas compras anúncios' },
  { id: 'app-browser', name: 'Internet', icon: 'fas fa-globe', cls: 'bg-browser', kw: 'navegador site' },
  { id: 'app-settings', name: 'Ajustes', icon: 'fas fa-cog', cls: 'bg-settings', kw: 'configurações perfil' }

const appIcon = (a, label) => `<div class="app-icon" data-act="openApp" data-app="${a.id}" data-name="${esc(a.name + ' ' + a.kw)}"><div class="icon-box ${a.cls}"><i class="${a.icon}"></i>${a.id === 'app-whatsapp' ? '<span class="badge" data-wabadge></span>' : ''}</div>${label ? `<span class="app-name">${a.name}</span>` : ''}</div>`;
$('app-grid').innerHTML = APPS.map(a => appIcon(a, true)).join('') + '<div class="no-results" id="no-results">Nenhum app encontrado</div>';
$('dock').innerHTML = ['app-phone', 'app-whatsapp', 'app-camera', 'app-bank'].map(id => appIcon(APPS.find(a => a.id === id), false)).join('');

/* ================= Relógio / Toast ================= */
function updateClock() {
  const n = new Date(), t = `${pad2(n.getHours())}:${pad2(n.getMinutes())}`;
  document.querySelectorAll('.clock-txt').forEach(e => e.textContent = t);
  const d = n.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.querySelectorAll('.date-txt').forEach(e => e.textContent = d);
}
setInterval(updateClock, 1000); updateClock();
let toastTimer;
function toast(msg, type = '') {
  if (!S.set.notif && type === '') return;
  const el = $('toast'); el.textContent = msg; el.className = 'toast show ' + type;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
const offline = () => { if (S.set.plane) { toast('Sem sinal (modo avião)', 'err'); return true; } return false; };

/* ================= Camadas (subtelas e overlays) ================= */
const layers = [];
let isLocked = true, isDrawerOpen = false, activeAppId = null;
function setNavTheme() {
  const app = activeAppId ? $(activeAppId) : null;
  $('nav-bar').classList.toggle('dark', !!app && !app.classList.contains('dark') && !layers.some(l => l.overlay));
}
function openSub(app, html, cls = 'pad', onClose) {
  const s = $('sub-' + app); s.className = 'sub show ' + cls; s.innerHTML = html;
  layers.push({ el: s, onClose, app }); setNavTheme(); s.scrollTop = 0;
}
function openOverlay(el, onClose) { el.classList.add('show'); layers.push({ el, overlay: true, onClose }); setNavTheme(); }
function closeTop() {
  const l = layers.pop(); if (!l) return false;
  l.el.classList.remove('show'); if (l.onClose) l.onClose(); setNavTheme(); return true;
}
function clearLayers() { while (layers.length) closeTop(); }
const subOpen = (app) => layers.some(l => l.app === app);

function unlockPhone() { const l = $('lockscreen'); l.style.transform = 'translateY(-100%)'; l.style.opacity = '0'; isLocked = false; }
function lockPhone() { goHome(); const l = $('lockscreen'); l.style.transform = 'translateY(0)'; l.style.opacity = '1'; isLocked = true; }
function openDrawer() { if (isLocked || activeAppId) return; $('app-drawer').classList.add('open'); isDrawerOpen = true; }
function closeDrawer() { $('app-drawer').classList.remove('open'); isDrawerOpen = false; $('app-search').value = ''; filterApps(''); }
function openApp(id) {
  if (isLocked) return;

  if (activeAppId) { clearLayers(); $(activeAppId).classList.remove('show'); }
  if (isDrawerOpen) closeDrawer();
  activeAppId = id; $(id).classList.add('show'); setNavTheme();
  ({ 'app-bank': renderBank, 'app-gps': renderGps, 'app-uber': renderUber, 'app-services': renderServices, 'app-camera': renderCamera, 'app-gallery': renderGallery, 'app-music': renderMusic, 'app-olx': renderOlx, 'app-browser': renderBrowser, 'app-settings': renderSettings, 'app-phone': renderPhone, 'app-whatsapp': renderWA })[id]?.();
}
function closeCurrentApp() { if (!activeAppId) return; clearLayers(); $(activeAppId).classList.remove('show'); activeAppId = null; setNavTheme(); }
function goBack() { if (isLocked) return; if (layers.length) closeTop(); else if (activeAppId) closeCurrentApp(); else if (isDrawerOpen) closeDrawer(); }
function goHome() { if (isLocked && !activeAppId) return; closeCurrentApp(); closeDrawer(); }
function filterApps(q) {
  q = q.trim().toLowerCase(); let n = 0;
  document.querySelectorAll('#app-grid .app-icon').forEach(el => { const ok = !q || el.dataset.name.toLowerCase().includes(q); el.style.display = ok ? '' : 'none'; if (ok) n++; });
  $('no-results').style.display = n ? 'none' : 'block';
}
$('app-search').addEventListener('input', e => filterApps(e.target.value));

/* Botão lateral: clique = bloquear/desbloquear • segurar = fechar */
(function () {
  const b = $('btn-power'); let t, long = false;
  b.addEventListener('pointerdown', () => { long = false; t = setTimeout(() => { long = true; closePhoneHTML(); }, 700); });
  b.addEventListener('pointerleave', () => clearTimeout(t));
  b.addEventListener('pointerup', () => { clearTimeout(t); if (!long) (isLocked ? unlockPhone() : lockPhone()); });
})();
function closePhoneHTML() {
  if (window.Android && typeof window.Android.sendCommand === 'function') window.Android.sendCommand('/close_cell');

}
/* Gestos */
(function () {
  const area = $('touch-area'); let sy = null;
  area.addEventListener('pointerdown', e => { sy = e.clientY; });
  area.addEventListener('pointerup', e => {
    if (sy === null) return; const diff = (sy - e.clientY) / 0.42; sy = null;
    if (diff > 50) { if (isLocked) unlockPhone(); else if (!isDrawerOpen && !activeAppId) openDrawer(); }
    else if (diff < -50 && isDrawerOpen) closeDrawer();
  });
})();

/* ================= Modal genérico ================= */
function fieldHTML(f) {
  const lab = f.label ? `<label>${f.label}</label>` : '';
  if (f.type === 'select') return `${lab}<select class="input-field" id="mf-${f.id}">${f.options.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('')}</select>`;

  if (f.type === 'colors') return `${lab}<div class="colors" id="mf-${f.id}" data-val="${STORY_COLORS[0]}">${STORY_COLORS.map((c, i) => `<span class="${i ? '' : 'sel'}" style="background:${c}" data-act="pickColor" data-c="${c}"></span>`).join('')}</div>`;
  return `${lab}<input class="input-field" id="mf-${f.id}" type="${f.type || 'text'}" placeholder="${esc(f.ph || '')}" value="${esc(f.val || '')}" maxlength="${f.max || 60}" ${f.min !== undefined ? `min="${f.min}"` : ''}>`;
}
function ask(title, fields, okText, cb, sub) {
  $('modal-card').innerHTML = `<h4>${title}</h4>${sub ? `<p>${sub}</p>` : ''}${fields.map(fieldHTML).join('')}<div class="m-row"><button class="m-btn" data-act="mClose">Cancelar</button><button class="m-btn ok" id="m-ok">${okText}</button></div>`;

    const vals = {}; let bad = false;
    fields.forEach(f => {
      const el = $('mf-' + f.id); const v = f.type === 'colors' ? el.dataset.val : el.value.trim();
      el.classList.remove('error');
      if (f.req && !v) { bad = true; el.classList.add('error'); }
      vals[f.id] = v;
    });
    if (bad) return; closeTop(); cb(vals);
  };
  const first = $('modal-card').querySelector('input,textarea'); if (first) setTimeout(() => first.focus(), 60);
}

let ride = 'UberX', tripTimer = null;
const RIDES = [{ n: 'UberX', ic: 'fa-car', d: 'Econômico • 3 min', p: 15 }, { n: 'Comfort', ic: 'fa-car-on', d: 'Mais espaço • 5 min', p: 25 }, { n: 'Moto', ic: 'fa-motorcycle', d: 'Mais rápido • 2 min', p: 9 }];
function renderUber() {
  $('c-uber').innerHTML = `<h3 style="margin-bottom:10px"><i class="fas fa-location-dot"></i> Para onde você quer ir?</h3>
    <input type="text" id="uber-dest" class="input-field" placeholder="Endereço ou local..." maxlength="60">
    ${RIDES.map(r => `<div class="row ride-opt ${r.n === ride ? 'selected' : ''}" data-act="pickRide" data-r="${r.n}"><div class="ic" style="background:#000"><i class="fas ${r.ic}"></i></div><div class="grow"><b>${r.n}</b><small>${r.d}</small></div><b>R$ ${r.p}</b></div>`).join('')}
    <div style="font-size:11px;color:#888;margin:4px 0">Pagamento: CariocaPay</div>
    <button class="btn-action" style="background:#000" data-act="uberGo"><i class="fas fa-car"></i> Solicitar Viagem</button>
    <div class="section-title">Viagens recentes</div>
    ${S.trips.slice(0, 5).map(t => `<div class="row" style="cursor:default"><div class="ic" style="background:#333"><i class="fas fa-route"></i></div><div class="grow"><b>${esc(t.dest)}</b><small>${t.ride} • ${hm(t.ts)}</small></div><b>R$ ${t.price}</b></div>`).join('') || '<div class="empty"><i class="fas fa-clock-rotate-left"></i>Nenhuma viagem ainda</div>'}`;
}
function startTrip(dest) {
  const r = RIDES.find(x => x.n === ride); const trip = { dest, ride, price: r.p, driver: ['Carlos', 'Marcos', 'Ana', 'Rafael', 'Júlia'][rnd(0, 4)], plate: `${String.fromCharCode(rnd(65, 90))}${String.fromCharCode(rnd(65, 90))}${String.fromCharCode(rnd(65, 90))}-${rnd(1000, 9999)}`, step: 0 };
  const draw = () => {
    const s = ['Procurando motorista...', 'Motorista a caminho', 'Motorista chegou!'][trip.step];
    const sub = $('sub-uber'); if (!sub.classList.contains('show')) return;
    sub.innerHTML = `<div style="text-align:center;padding:10px 0"><i class="fas fa-car-side" style="font-size:44px"></i><h3 style="margin-top:10px">${s}</h3><small style="color:#777">${esc(dest)}</small></div><div class="pbar"><div style="width:${(trip.step + 1) * 33}%"></div></div>
      ${trip.step ? `<div class="row" style="cursor:default">${av(trip.driver)}<div class="grow"><b>${trip.driver}</b><small>${r.n} • ${trip.plate}</small></div><b>R$ ${r.p}</b></div>` : ''}
      ${trip.step === 2 ? `<button class="btn-action" style="background:#000" data-act="tripEnd">Finalizar viagem</button>` : ''}
      <button class="btn-action" style="background:#d32f2f" data-act="tripCancel"><i class="fas fa-xmark"></i> Cancelar</button>`;
  };
  openSub('uber', '', 'pad', () => { clearInterval(tripTimer); }); draw();
  clearInterval(tripTimer); tripTimer = setInterval(() => { if (trip.step < 2) { trip.step++; draw(); } else clearInterval(tripTimer); }, 3500);
  trip.finish = () => {
    clearInterval(tripTimer);
    if (S.balance >= trip.price) { S.balance -= trip.price; addTx('out', `Uber • ${dest}`, trip.price); toast(`Viagem paga: R$ ${trip.price}`, 'ok'); } else toast('Saldo insuficiente. Pague em dinheiro ao motorista.', 'err');
    S.trips.unshift({ dest, ride: trip.ride, price: trip.price, ts: Date.now() }); save(); closeTop(); renderUber();
  };
  window._trip = trip; emit('phone:callUber', dest, ride);
}

const fmtDur = (s) => `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;
function updateDial() { const d = $('dial-display'); if (!d) return; d.textContent = dialNum; $('dial-name').textContent = dialNum ? (findContact(dialNum)?.name || '') : ''; }

function addContact(name = '', num = '', after) {
  ask('Novo contato', [{ id: 'name', label: 'Nome', ph: 'Ex: João', val: name, req: 1, max: 30 }, { id: 'num', label: 'Número de celular do jogador', ph: 'Digite o número de celular do outro jogador', val: num, req: 1, type: 'number', max: 12 }], 'Salvar', (v) => {

/* Chamadas */
let call = null;
function renderCall() {
  const ov = $('call-ov'); if (!call) return;
  const st = call.state === 'on' ? fmtDur(Math.floor((Date.now() - call.t0) / 1000)) : call.state === 'in' ? 'Chamada recebida' : 'Chamando...';
  ov.innerHTML = `<div><div class="av" style="background:${colorOf(nameOf(call.num))}">${esc(nameOf(call.num)[0].toUpperCase())}</div><h2>${esc(nameOf(call.num))}</h2><p>${esc(call.num)}</p><p>${st}</p></div>
    <div class="call-ctrls">${call.state === 'in' ? `<button class="cbtn end" data-act="callDecline"><i class="fas fa-phone-slash"></i></button><button class="cbtn acc" data-act="callAccept"><i class="fas fa-phone"></i></button>` :
      `<button class="cbtn ${call.mute ? 'on' : ''}" data-act="callMute"><i class="fas fa-microphone-slash"></i></button><button class="cbtn end" data-act="callEnd"><i class="fas fa-phone-slash"></i></button><button class="cbtn ${call.spk ? 'on' : ''}" data-act="callSpk"><i class="fas fa-volume-high"></i></button>`}</div>`;
}
function startCall(num) {
  num = String(num).trim(); if (!num) return toast('Digite um número', 'err');
  if (offline() || call) return;
  call = { num, state: 'ring', dir: 'out' }; $('call-ov').classList.add('show'); renderCall(); emit('phone:call', num);
  if (!window.cef) setTimeout(callAnswered, 2500);
}
function callAnswered() { if (!call || call.state === 'on') return; call.state = 'on'; call.t0 = Date.now(); clearInterval(call.timer); call.timer = setInterval(renderCall, 1000); renderCall(); }
function endCall(send = true, missed = false) {
  if (!call) return; clearInterval(call.timer);
  const dur = call.t0 ? Math.floor((Date.now() - call.t0) / 1000) : 0;
  S.calls.unshift({ num: call.num, out: call.dir === 'out', ts: Date.now(), dur, missed: missed || (call.dir === 'in' && !call.t0) }); S.calls = S.calls.slice(0, 50); save();
  if (send) emit('phone:hangup', call.num); call = null; $('call-ov').classList.remove('show'); if (activeAppId === 'app-phone' && !subOpen('phone')) renderPhone(); if (activeAppId === 'app-whatsapp') renderWA();
}

/* Stories */
let storyTimer = null, story = null;
function openStories(list, num, mine) {
  story = { list, i: 0, num, mine }; openOverlay($('story-ov'), () => { clearTimeout(storyTimer); if (activeAppId === 'app-whatsapp') renderWA(); });
  drawStory();
}
function drawStory() {
  const s = story.list[story.i], ov = $('story-ov'); clearTimeout(storyTimer);
  ov.style.background = s.bg;
  ov.innerHTML = `<div class="story-bars">${story.list.map((_, i) => `<div class="${i < story.i ? 'done' : i === story.i ? 'run' : ''}"><i></i></div>`).join('')}</div>
    <div class="story-head">${av(story.mine ? S.me.name : nameOf(story.num), 36)}<div style="flex:1"><b>${story.mine ? 'Meu status' : esc(nameOf(story.num))}</b><small>${hm(s.ts)}</small></div>${story.mine ? '<i class="fas fa-trash" data-act="delStory"></i>' : ''}<i class="fas fa-xmark" data-act="closeStory"></i></div>
    <div class="story-text">${s.image ? `<img src="${s.image}" style="max-width:100%;max-height:72%;object-fit:contain;border-radius:12px">` : esc(s.text)}</div><div class="story-tap l" data-act="storyPrev"></div><div class="story-tap r" data-act="storyNext"></div>`;
  if (!story.mine) { S.seen[story.num] = Math.max(S.seen[story.num] || 0, s.ts); save(); }
  storyTimer = setTimeout(storyNext, 4500);
}
function storyNext() { if (!story) return; if (story.i < story.list.length - 1) { story.i++; drawStory(); } else closeTop(); }

  tripCancel: () => { emit('phone:cancelUber'); toast('Viagem cancelada'); closeTop(); },
  /* Serviços */
  callService: (d) => { if (offline()) return; ask('Chamar ' + d.t, [{ id: 'd', label: 'Descreva a situação (opcional)', type: 'area', max: 120, ph: 'Ex: acidente na Av. Principal' }], 'Chamar', (v) => { S.services.unshift({ t: d.t, d: v.d, ts: Date.now() }); S.services = S.services.slice(0, 20); save(); emit('phone:callService', d.t, v.d); toast(d.t + ' acionado!', 'ok'); renderServices(); }); },
  /* Câmera / Galeria */
  camFlash: () => { camFlash = !camFlash; renderCamera(); }, camFlip: () => { camSelfie = !camSelfie; renderCamera(); },
  snap: () => {
    const f = $('cam-flash'); if (camFlash) { f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
    const i = rnd(0, COLORS.length - 1); S.photos.unshift({ id: Date.now(), name: `IMG_${pad2(new Date().getDate())}${pad2(S.photos.length + 1)}`, c1: COLORS[i], c2: COLORS[(i + 3) % COLORS.length], ts: Date.now() });
    save(); emit('phone:takePhoto'); toast('Foto salva na galeria');
  },
  viewPhoto: (d) => { const p = S.photos.find(x => x.id == d.id); if (!p) return; openSub('gallery', `<div style="height:320px;border-radius:16px;background:linear-gradient(135deg,${p.c1},${p.c2});display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:700">${esc(p.name)}</div><div style="font-size:12px;color:#777;margin:10px 0">${new Date(p.ts).toLocaleString('pt-BR')}</div><button class="btn-action" style="background:#c62828" data-act="delPhoto" data-id="${p.id}"><i class="fas fa-trash"></i> Excluir foto</button>`); },
  delPhoto: (d) => { S.photos = S.photos.filter(x => x.id != d.id); save(); closeTop(); renderGallery(); toast('Foto excluída'); },
  /* Música */
  musToggle: () => musicSet(station, !playing), musNext: () => musicSet(station + 1, true), musPrev: () => musicSet(station - 1, true), musPick: (d) => musicSet(+d.i, true),
  /* OLX */
  olxTab: (d) => { olxTab = d.t; renderOlx(); },
  olxNew: () => ask('Novo anúncio', [{ id: 't', label: 'Título', req: 1, max: 30 }, { id: 'p', label: 'Preço (R$)', type: 'number', req: 1, max: 12 }, { id: 'd', label: 'Descrição', type: 'area', max: 80 }], 'Anunciar', (v) => { const p = parseFloat(v.p); if (!(p > 0)) return toast('Preço inválido', 'err'); S.ads.unshift({ id: Date.now(), title: v.t, price: p, desc: v.d || 'Sem descrição', seller: S.me.name, mine: true }); save(); emit('phone:sellOlx', v.t, p); toast('Anúncio publicado', 'ok'); renderOlx(); }),
  olxDel: (d) => { S.ads = S.ads.filter(a => a.id != d.id); save(); renderOlx(); },
  olxBuy: (d) => { const a = S.ads.find(x => x.id == d.id); if (!a || offline()) return; confirmBox('Comprar ' + esc(a.title), `Pagar R$ ${money(a.price)} com CariocaPay?`, 'Comprar', () => { if (S.balance < a.price) return toast('Saldo insuficiente', 'err'); S.balance -= a.price; addTx('out', 'OLX • ' + a.title, a.price); save(); emit('phone:buyOlx', a.title, a.price); toast('Compra realizada!', 'ok'); renderOlx(); }); },
  /* Navegador */
  webGo: () => { const q = $('url-input').value.trim(); if (!q) return shake('url-input'); A.webQ({ q }); },
  webQ: (d) => { const q = d.q; const s = SITES.find(x => x.u.includes(q.toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '')) || x_n(x, q)); s ? webPage(s.n, s.u, s.d) : webPage('Resultados para "' + q + '"', q, 'Nenhum resultado oficial encontrado no servidor. Tente pesquisar por Carioca Roleplay, Discord, Fórum ou Loja VIP.'); },
  webOpen: (d) => { const s = SITES[+d.i]; webPage(s.n, s.u, s.d); },
  /* Ajustes */
  editProfile: () => ask('Meu perfil', [{ id: 'n', label: 'Nome', val: S.me.name, req: 1, max: 24 }, { id: 'num', label: 'Meu número', type: 'number', val: S.me.num, req: 1, max: 10 }], 'Salvar', (v) => { S.me.name = v.n; S.me.num = v.num; save(); renderSettings(); emit('phone:setProfile', v.n, v.num); toast('Perfil atualizado', 'ok'); }),
  resetPhone: () => confirmBox('Restaurar celular', 'Todos os dados (contatos, mensagens, fotos) serão apagados.', 'Restaurar', () => { try { localStorage.removeItem(KEY); } catch (e) {} S = DEF(); save(); closeCurrentApp(); applySettings(); updateBadge(); toast('Celular restaurado', 'ok'); }),
  /* Telefone & contatos */
  phoneTab: (d) => { phoneTab = d.t; renderPhone(); },
  key: (d) => { if (dialNum.length < 12) { dialNum += d.k; updateDial(); } }, delKeyDial: () => { dialNum = dialNum.slice(0, -1); updateDial(); },
  dialCall: () => startCall(dialNum), callNum: (d) => startCall(d.num),
  saveDial: () => { if (!dialNum) return toast('Digite um número', 'err'); addContact('', dialNum); },
  addContact: () => addContact(), addContact2: () => addContact('', '', () => { closeTop(); newChatList(); }),
  contactView: (d) => contactView(d.num),
  editContact: (d) => { const c = findContact(d.num); addContact(c.name, c.num, () => { closeTop(); renderPhone(); }); },
  delContact: (d) => confirmBox('Excluir contato', `Remover ${esc(nameOf(d.num))}?`, 'Excluir', () => { S.contacts = S.contacts.filter(c => c.num !== d.num); save(); closeTop(); renderPhone(); toast('Contato excluído'); }),
  chatWith: (d) => { closeTop(); if (activeAppId !== 'app-whatsapp') openApp('app-whatsapp'); openChat(d.num); },
  /* Chamadas */
  callEnd: () => endCall(), callMute: () => { call.mute = !call.mute; renderCall(); }, callSpk: () => { call.spk = !call.spk; renderCall(); },
  callAccept: () => { call.state = 'on'; call.t0 = Date.now(); clearInterval(call.timer); call.timer = setInterval(renderCall, 1000); emit('phone:answer', call.num); renderCall(); },
  callDecline: () => { emit('phone:decline', call.num); endCall(false, true); toast('Chamada recusada'); },
  /* WhatsApp */
  waTab: (d) => { waTab = d.t; renderWA(); },
  waFab: () => { if (waTab === 'chats') newChatList(); else if (waTab === 'status') addStatus(); else { ask('Ligar para', [{ id: 'n', label: 'Número', type: 'number', req: 1, max: 12 }], 'Ligar', (v) => startCall(v.n)); } },
  openChat: (d) => openChat(d.num),
  waSend: (d) => {
    const inp = $('wa-msg'), t = inp.value.trim(); if (!t) return shake('wa-msg'); if (offline()) return;
    pushMsg(d.num, t, true); emit('phone:sendWhatsapp', d.num, t); inp.value = ''; inp.focus();
  },
  ncGo: () => { const n = $('nc-num').value.replace(/\D/g, ''); if (!n || n.length < 6) return shake('nc-num'); closeTop(); openChat(n); },
  saveFromChat: (d) => addContact('', d.num, () => { closeTop(); openChat(d.num); }),
  addStatus: () => addStatus(), viewMyStatus: () => openStories(activeStories(S.myStatus), null, true),
  viewStatus: (d) => openStories(activeStories(S.statuses[d.num]), d.num, false),
  closeStory: () => closeTop(), storyNext: storyNext, storyPrev: () => { if (story.i > 0) story.i--; drawStory(); },
  delStory: () => { const s = story.list[story.i]; S.myStatus = S.myStatus.filter(x => x !== s); save(); closeTop(); toast('Status excluído'); }
};
function x_n(x, q) { return x.n.toLowerCase().includes(q.toLowerCase()); }
$('touch-area').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) { try { f(el.dataset, el); } catch (err) { console.error(err); } }
});
$('touch-area').addEventListener('change', (e) => {
  const k = e.target.dataset.set; if (!k) return;
  S.set[k] = e.target.checked; save(); applySettings();
  if (k === 'plane') toast(S.set.plane ? 'Modo avião ativado' : 'Modo avião desativado', 'ok'); else if(k==='darkMode') toast(S.set.darkMode?'Modo escuro ativado':'Modo escuro desativado','ok');
});
$('touch-area').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const id = e.target.id; const m = { 'wa-msg': () => document.querySelector('[data-act="waSend"]')?.click(), 'url-input': () => A.webGo(), 'uber-dest': () => A.uberGo(), 'nc-num': () => A.ncGo() }[id]; if (m) m();
});

/* ================= API para o servidor/Lua ================= */
window.phoneAPI = {
  setBalance,
  setProfile(name, id, num) { if (name) S.me.name = name; if (id) S.me.id = String(id); if (num) S.me.num = String(num); save(); },
  receiveMessage(from, text) { from = String(from); pushMsg(from, text, false); if (curChat !== from) { S.unread[from] = (S.unread[from] || 0) + 1; save(); toast(nameOf(from) + ': ' + text.slice(0, 40)); } updateBadge(); if (activeAppId === 'app-whatsapp' && !subOpen('whatsapp')) renderWA(); },
  receiveStatus(from, text, bg) { from = String(from); (S.statuses[from] = S.statuses[from] || []).push({ text, bg: bg || STORY_COLORS[0], ts: Date.now() }); save(); toast(nameOf(from) + ' postou um status'); if (activeAppId === 'app-whatsapp' && !subOpen('whatsapp')) renderWA(); },
  receivePix(from, val) { val = Number(val); S.balance += val; addTx('in', `Pix de ID ${from}`, val); save(); toast(`Você recebeu R$ ${money(val)} de ${from}`, 'ok'); if (activeAppId === 'app-bank') renderBank(); },
  cardPurchase(val, desc) { S.fatura += Number(val); save(); toast(`Compra no cartão: R$ ${money(val)}`); },
  incomingCall(num) { if (S.set.plane || call) return; call = { num: String(num), state: 'in', dir: 'in' }; $('call-ov').classList.add('show'); renderCall(); },
  callAnswered, callEnded() { endCall(false); },
  notify: toast
};

applySettings(); updateBadge();
</script>
</body>
